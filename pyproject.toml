[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ps5-remoteplay"
version = "0.1.7"
description = "Wake, standby and status for PlayStation 5 consoles over the local Remote Play protocol"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/iharosi/ps5-remoteplay"
Source = "https://github.com/iharosi/ps5-remoteplay"
Issues = "https://github.com/iharosi/ps5-remoteplay/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ps5-remoteplay = "ps5_remoteplay.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ps5_remoteplay"]
